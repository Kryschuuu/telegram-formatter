# Render-Blueprint für das Dashboard (https://docs.render.com/blueprint-spec)
# ============================================================================
# Deklariert den **kanonischen** Start dieses Dienstes. Der Einstieg liegt
# seit 2.0.0 im Paket — siehe MIGRATION.md, Abschnitt 3. Das Root-Modul
# ``app.py`` ist nur noch ein veralteter Kompatibilitäts-Shim (entfällt mit
# 3.0.0) und wird hier bewusst *nicht* referenziert.
#
# Wirkung:
#   * Ein **neu** über diesen Blueprint angelegter Dienst (Render → New →
#     Blueprint) bekommt Build-, Start-, Health-Check- und Umgebungs-
#     konfiguration direkt aus dieser Datei.
#   * Ein **bestehender**, per Hand im Dashboard angelegter Web Service wird
#     davon *nicht* automatisch umgestellt — siehe den Blueprint-Sync-Hinweis
#     in docs/DEPLOYMENT.md (Schritt 3a).
#
# Secrets gehören nicht ins Git: ``sync: false`` hält die Werte im
# Dashboard-Store (beim ersten Blueprint-Durchlauf wird danach gefragt).
services:
  - type: web
    name: telegram-formatter
    runtime: python
    plan: free # für mehr Leistung ersetzen, z. B. 0.5c-512mb
    branch: main
    buildCommand: pip install -r requirements.txt
    # Die Anführungszeichen um das Modul bleiben: Render führt den Befehl über
    # eine Shell aus, und das quoting hält "modul:objekt" als ein Argument
    # (identisch zu docs/DEPLOYMENT.md, Schritt 3).
    # Genau EIN Worker-Prozess + Threads: die BYOB-Websessions (v2.2.0) leben
    # prozesslokal im RAM — mehrere Worker würden Sessions "verlieren"
    # (Details: docs/DEPLOYMENT.md, Hinweis zum Start Command).
    startCommand: 'gunicorn "telegram_formatter.app:app" --bind 0.0.0.0:$PORT --threads 8'
    healthCheckPath: /
    envVars:
      # Python-Version der Build-Umgebung (muss zu requires-python >= 3.10 passen).
      - key: PYTHON_VERSION
        value: "3.11"
      # Secret bleibt im Dashboard-Store, nie im Git.
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
        # Empfehlung für die öffentliche Demo: hier die ID einer *public*
        # Supergroup (oder eines Channels mit dem Bot-Recht „Nachrichten senden“)
        # eintragen. Damit ist die Warnung auf der Seite wörtlich korrekt
        # („jeder, der die Gruppe öffnet, kann den gesamten Verlauf lesen“) und
        # dein persönliches Postfach bleibt ruhig. Eine Nachricht dort schreiben,
        # die negative ID (meist -100…) ablesen, dann hier eintragen → Redeploy.
      # Operator secret for the *authenticated* shared-send path (X-Auth-Token).
      # Leave unset on public demo instances: the browser never receives it.
      - key: TELEGRAM_FORMATTER_API_TOKEN
        sync: false
      # Shared bot (@mdtotxt_bot) selectable in the browser's send dialog.
      # Only effective together with a pinned TELEGRAM_CHAT_ID; "0" closes
      # anonymous sending again (API-only, the 2.5.0 behaviour). Abuse limits:
      # TELEGRAM_FORMATTER_SHARED_WEB_SENDS_PER_MINUTE[_TOTAL] / …_MAX_INPUT_CHARS.
      - key: TELEGRAM_FORMATTER_SHARED_WEB_SEND
        value: "1"
      # Anzeige-Name des geteilten Bots in der Privatsphäre-Warnung (Standard
      # @mdtotxt_bot). Muss zum Bot passen, der hinter TELEGRAM_BOT_TOKEN steht.
      - key: TELEGRAM_FORMATTER_SHARED_BOT_HANDLE
        value: "@mdtotxt_bot"
      # Render provides exactly one trusted proxy hop. The application
      # defaults to zero for safe direct/self-hosted deployments.
      - key: TELEGRAM_FORMATTER_TRUSTED_PROXY_HOPS
        value: "1"
