# Render-Blueprint für das Dashboard (https://docs.render.com/blueprint-spec)
# ============================================================================
# Deklariert den **kanonischen** Start dieses Dienstes. Der Einstieg liegt
# seit 2.0.0 im Paket — siehe MIGRATION.md, Abschnitt 3. Das Root-Modul
# ``app.py`` ist nur noch ein veralteter Kompatibilitäts-Shim (entfällt mit
# 3.0.0) und wird hier bewusst *nicht* referenziert.
#
# Wirkung:
#   * Ein **neu** über diesen Blueprint angelegter Dienst (Render → New →
#     Blueprint) bekommt Build-, Start-, Health-Check- und Umgebungs-
#     konfiguration direkt aus dieser Datei.
#   * Ein **bestehender**, per Hand im Dashboard angelegter Web Service wird
#     davon *nicht* automatisch umgestellt — siehe den Blueprint-Sync-Hinweis
#     in docs/DEPLOYMENT.md (Schritt 3a).
#
# Geheimnisse gehören nicht ins Git: ``sync: false`` hält die Werte im
# Dashboard-Store (beim ersten Blueprint-Durchlauf wird danach gefragt).
#
# Vertragstest: tests/test_deployment.py (Abschnitt "render.yaml"). Er prüft
# die Felder gegen die Render-Spec, den Health-Check-Pfad gegen die wirklich
# registrierte Route und jeden envVar-Schlüssel gegen den Code. Blueprint und
# Implementierung können deshalb nicht mehr auseinanderlaufen.
# ============================================================================
services:
  - type: web
    name: telegram-formatter
    runtime: python
    # Region ist nach dem Anlegen **nicht mehr änderbar** ("You can't modify
    # this value after creation"). Deshalb wird sie hier ausdrücklich
    # festgelegt: Frankfurt statt des impliziten Defaults oregon (USA). Ohne
    # diese Zeile wäre die Entscheidung still gefallen und später nicht mehr
    # korrigierbar.
    region: frankfurt
    # Zu mehr Leistung: 0.5c-512mb (freiwillig, kostenpflichtig).
    # `free` ist ein gültiger Plan (0.1 CPU / 512 MB), aber nur in
    # **persönlichen** Workspaces buchbar — im Team-Workspace muss ein
    # bezahlter Plan gewählt werden (docs/DEPLOYMENT.md, Troubleshooting).
    plan: free
    # `branch:` ist bewusst NICHT gesetzt. Die Blueprint-Spec: "Render uses
    # the Blueprint's branch if the service uses the same repo as the
    # Blueprint file." Ein Gepinntwert kann also nur zusätzlich stören — genau
    # dieses Feld liefert in Renders eigenem Beispiel den Fehler
    # "branch prod could not be found". Ohne Repo-Umweg nimmt Render den
    # Branch, in dem der Blueprint liegt (hier `main`).
    #
    # Genau EIN Instanz, und zwar dokumentiert: die BYOB-Websessions (v2.2.0)
    # leben prozesslokal im RAM. Eine zweite Instanz würde eine Session
    # "verlieren" (410 statt Fehlversand) — dieselbe Begründung, die den
    # einzelnen Gunicorn-Worker erzwingt.
    numInstances: 1
    # Ein Commit auf dem Blueprint-Branch löst einen Deploy aus. Beim Ersten
    # Anlegen startet Render ohnehin einen Deploy, deshalb ist der Wert hier
    # nur die Festlegung für die Folge-Commits.
    autoDeployTrigger: commit
    # Nach der Installation wird scripts/check_build.py ausgeführt: es prüft,
    # dass das Paket importierbar ist, die Health-Check-Route existiert und
    # Templates samt static/katex/ (v2.14.0, MIT) vollständig sind. Ohne diesen
    # Schritt fällt ein fehlendes Asset erst zur Laufzeit auf — die Seite lädt
    # dann 404 statt Formeln zu setzen, und der einzige Ort, an dem das
    # auffällt, ist die Sprechblase im Browser eines Nutzers.
    buildCommand: pip install -r requirements.txt && python scripts/check_build.py
    # Die Anführungszeichen um das Modul bleiben: Render führt den Befehl über
    # eine Shell aus, und das quoting hält "modul:objekt" als ein Argument
    # (identisch zu docs/DEPLOYMENT.md, Schritt 3).
    # Genau EIN Worker-Prozess + Threads: die BYOB-Websessions (v2.2.0) leben
    # prozesslokal im RAM — mehrere Worker würden Sessions "verlieren"
    # (Details: docs/DEPLOYMENT.md, Hinweis zum Start Command).
    startCommand: 'gunicorn "telegram_formatter.app:app" --bind 0.0.0.0:$PORT --threads 8'
    # Liveness-Probe (seit v2.12.0): billiger als "/" (kein Template-Rendering),
    # nie ratenlimitiert und ohne Konfigurationsdetails in der Antwort.
    # Vertragstest prüft, dass genau diese Route in app.py registriert ist.
    healthCheckPath: /healthz
    envVars:
      # Python-Version der Build-Umgebung (muss zu requires-python >= 3.10 passen).
      # Einziger Schlüssel, den die Anwendung selbst NICHT liest — er wird von
      # Renders Build-Umgebung ausgewertet. Der Vertragstest kennt ihn als
      # bewusste Ausnahme.
      - key: PYTHON_VERSION
        value: "3.11"
      # Secret bleibt im Dashboard-Store, nie im Git.
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
        # Empfehlung für die öffentliche Demo: hier die ID einer *public*
        # Supergroup (oder eines Channels mit dem Bot-Recht „Nachrichten senden“)
        # eintragen. Damit ist die Warnung auf der Seite wörtlich korrekt
        # („jeder, der die Gruppe öffnet, kann den gesamten Verlauf lesen“) und
        # dein persönliches Postfach bleibt ruhig. Eine Nachricht dort schreiben,
        # die negative ID (meist -100…) ablesen, dann hier eintragen → Redeploy.
      # Operator secret for the *authenticated* shared-send path (X-Auth-Token).
      # Leave unset on public demo instances: the browser never receives it.
      - key: TELEGRAM_FORMATTER_API_TOKEN
        sync: false
      # Shared bot (@mdtotxt_bot) selectable in the browser's send dialog.
      # Only effective together with a pinned TELEGRAM_CHAT_ID; "0" closes
      # anonymous sending again (API-only, the 2.5.0 behaviour). Abuse limits:
      # TELEGRAM_FORMATTER_SHARED_WEB_SENDS_PER_MINUTE[_TOTAL] / …_MAX_INPUT_CHARS.
      - key: TELEGRAM_FORMATTER_SHARED_WEB_SEND
        value: "1"
      # Anzeige-Name des geteilten Bots in der Privatsphäre-Warnung (Standard
      # @mdtotxt_bot). Muss zum Bot passen, der hinter TELEGRAM_BOT_TOKEN steht.
      - key: TELEGRAM_FORMATTER_SHARED_BOT_HANDLE
        value: "@mdtotxt_bot"
      # Öffentlicher Link zum Zielchat von TELEGRAM_CHAT_ID (v2.9.0). Die Seite
      # nennt diesen Kanal an mehreren Stellen (Top-Warnung, Kanal-Banner,
      # Senden-Hinweis, Bestätigungsdialog, Privatsphäre, FAQ, Footer).
      # Akzeptiert werden nur https://t.me/<handle>, t.me/<handle> und
      # @<handle> — alles andere wird verworfen (kein Link im UI). Der Wert
      # MUSS zu TELEGRAM_CHAT_ID gehören, sonst verspricht die Seite einen
      # Kanal, in den sie gar nicht sendet.
      - key: TELEGRAM_FORMATTER_SHARED_CHAT_URL
        value: "https://t.me/mdtotxt_bot_web"
      # Aufbewahrungsdauer in Tagen, die der Kanal oben als Löschfrist angibt.
      # MUSS der Telegram-Einstellung „Nachrichten automatisch löschen" dieses
      # Kanals entsprechen (1 Monat = 30). "0" = keine Aussage: Dann nennt die
      # Seite keine Frist und die FAQ sagt, dass die Beiträge dauerhaft
      # öffentlich bleiben.
      - key: TELEGRAM_FORMATTER_SHARED_RETENTION_DAYS
        value: "30"
      # Render provides exactly one trusted proxy hop. The application
      # defaults to zero for safe direct/self-hosted deployments.
      - key: TELEGRAM_FORMATTER_TRUSTED_PROXY_HOPS
        value: "1"
