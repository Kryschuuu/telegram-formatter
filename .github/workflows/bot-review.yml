name: Bot-Review

# Tor für Nutzer-Bots: Statik, Secret-Scan, Abhängigkeiten, Tests.
# Menschliche Freigaben (2, davon ≥1 Maintainer) erzwingt die
# Branch-Protection zusammen mit .github/CODEOWNERS.
# Pfade gemäß Paketstruktur ab v2.0.0 (siehe MIGRATION.md).

on:
  pull_request:
    paths:
      - "telegram_formatter/botkit/**"
      - "telegram_formatter/botctl.py"
      - "bots/**"
      - "examples/own_bot/**"
      - "audit/**"
      - ".gitleaks.toml"
      - "requirements*.txt"
      - "pyproject.toml"
      - "app.py"
      - "render.yaml"
      - ".github/workflows/bot-review.yml"
  push:
    branches: [main]
  schedule:
    # Wöchentlicher Abhängigkeits-Check: neue CVEs fallen auch ohne PR auf.
    - cron: "17 4 * * 1"

permissions:
  contents: read
  # Gitleaks kommentiert Funde am PR und lädt den SARIF-Report hoch.
  pull-requests: write

jobs:
  code-quality:
    name: Lint & Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Werkzeuge installieren
        run: |
          python -m pip install --upgrade pip
          pip install ruff bandit pip-audit
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff (Stil & Fehler)
        # app.py (Wurzel) explizit mitprüfen: der veraltete Deploy-Shim soll
        # stets ein reiner Weiterleiter bleiben (siehe tests/test_app.py).
        run: ruff check app.py telegram_formatter examples tests

      - name: Bandit (Sicherheits-Scan)
        # Volles Niveau (kein -ll): LOW-Funde müssen begründet nosec-getaggt
        # sein — so rutscht nichts durchs Severity-Filter (Audit O-10).
        run: bandit -c pyproject.toml -r telegram_formatter examples/own_bot

      - name: pip-audit (Laufzeit-Abhängigkeiten)
        run: pip-audit -r requirements.txt

      - name: pip-audit (Entwicklungs-Abhängigkeiten)
        run: pip-audit -r requirements-dev.txt

  secrets:
    name: Secret-Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write  # Kommentar mit den Funden am PR
      actions: write        # SARIF-Report als Artefakt hochladen
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Findet versehentlich committete Bot-Tokens, API-Keys, .env-Dateien.
      # Konfiguration (Freigaben für Negativbeispiele): .gitleaks.toml
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  bot-gate:
    name: Review-Gate (botkit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Statische Regeln (BK001–BK012) für geänderte Bot-Dateien
        run: |
          set -euo pipefail
          base="origin/${{ github.base_ref }}"
          if [ -z "${{ github.base_ref }}" ] || ! git rev-parse --verify "$base" >/dev/null 2>&1; then
            base="origin/main"
          fi
          files=$(git diff --name-only --diff-filter=ACMR "$base"...HEAD \
                  -- 'bots/**' 'examples/own_bot/**' \
                  | grep -E '\.py$' || true)
          if [ -z "$files" ]; then
            echo "Keine Bot-Dateien geändert — Gate übersprungen."
            exit 0
          fi
          status=0
          for file in $files; do
            echo "::group::review $file"
            python -m telegram_formatter.botctl review "$file" --bot-id 0 --check || status=1
            echo "::endgroup::"
          done
          exit $status

      - name: Referenz-Bot muss sauber bleiben
        run: python -m telegram_formatter.botctl review examples/own_bot/minimal_bot.py --bot-id 0 --check

      - name: Negativbeispiel muss erkannt werden (Regressionstest der Regeln)
        run: |
          if python -m telegram_formatter.botctl review tests/fixtures/insecure_bot.py --bot-id 0 --check; then
            echo "::error::Negativbeispiel wurde nicht erkannt — Regelwerk defekt!"
            exit 1
          fi

      - name: Audit-Trail darf keine Geheimnisse enthalten
        run: |
          if [ -f audit/reviews.json ]; then
            ! grep -qE '[0-9]{5,16}:[A-Za-z0-9_-]{35}' audit/reviews.json \
              || { echo "::error::Tokenförmiger Wert im Audit-Trail!"; exit 1; }
          fi

      - name: jsdom für funktionale Frontend-Tests (optional, gepinnt)
        # Aktiviert tests/test_jsdom_smoke.py (überspringt sauber ohne Node).
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Frontend-Dev-Abhängigkeiten (jsdom)
        run: npm ci

      - name: Unit-Tests
        run: pytest -q

      # Audit M-4: Der Vier-Augen-Trail war als CI-Tor nur "optional" und
      # auskommentiert — damit erzwang die Pipeline nur die Statik, nicht die
      # Freigaben. Aktiviert, sobald Repository-Variablen gesetzt sind
      # (settings → secrets and variables → actions → variables):
      #   BOT_ID=<numerische Bot-ID>   BOT_PATH=<reviewter Bot-Code, z. B. bots/x.py>
      - name: Freigabe prüfen (Audit-Trail, falls BOT_ID/BOT_PATH gesetzt)
        if: ${{ vars.BOT_ID != '' && vars.BOT_PATH != '' }}
        run: python -m telegram_formatter.botctl verify "${{ vars.BOT_PATH }}" --bot-id "${{ vars.BOT_ID }}"
