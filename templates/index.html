<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>PostMaster Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 font-sans h-screen flex">

    <nav class="w-64 bg-white border-r p-6 flex flex-col">
        <h1 class="text-xl font-black text-sky-600 mb-8"><i class="fa-solid fa-rocket"></i> PostMaster</h1>
        {% if logged_in %}
            <button onclick="showSection('editor')" class="text-left p-3 hover:bg-sky-50 rounded-lg mb-2"><i class="fa-solid fa-pen"></i> Editor</button>
            <button onclick="showSection('channels')" class="text-left p-3 hover:bg-sky-50 rounded-lg mb-2"><i class="fa-solid fa-tower-broadcast"></i> Kanäle</button>
        {% else %}
            <div id="tg-login-container">
                <script async src="https://telegram.org/js/telegram-widget.js?22" data-telegram-login="{{ bot_username }}" data-size="large" data-onauth="onTelegramAuth(user)"></script>
            </div>
        {% endif %}
    </nav>

    <main class="flex-1 p-10 overflow-y-auto">
        <div id="section-channels" class="max-w-2xl mx-auto">
            <h2 class="text-2xl font-bold mb-6">Kanäle & Gruppen</h2>
            <div class="bg-white p-6 rounded-2xl shadow-sm border mb-6">
                <p class="text-sm text-slate-500 mb-4">WICHTIG: Füge @{{ bot_username }} als Admin hinzu, bevor du die ID speicherst.</p>
                <div class="space-y-4">
                    <input type="text" id="c_id" placeholder="ID (z.B. -100...)" class="w-full p-3 border rounded-xl">
                    <input type="text" id="c_name" placeholder="Name (z.B. Meine Gruppe)" class="w-full p-3 border rounded-xl">
                    <button onclick="addChannel()" id="addBtn" class="w-full bg-sky-600 text-white font-bold py-3 rounded-xl hover:bg-sky-700">Kanal hinzufügen</button>
                </div>
                <div id="error-box" class="hidden mt-4 p-3 bg-red-50 text-red-600 border border-red-200 rounded-lg text-sm"></div>
            </div>
            <div id="channel-list" class="space-y-2"></div>
        </div>
    </main>

    <script>
        function onTelegramAuth(user) {
            fetch('/api/auth', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(user)
            }).then(() => window.location.reload());
        }

        async function addChannel() {
            const errBox = document.getElementById('error-box');
            const btn = document.getElementById('addBtn');
            errBox.classList.add('hidden');
            btn.disabled = true;
            btn.innerText = "Prüfe Rechte...";

            const res = await fetch('/api/channels', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    channel_id: document.getElementById('c_id').value,
                    channel_name: document.getElementById('c_name').value
                })
            });
            const data = await res.json();

            if(data.success) {
                location.reload();
            } else {
                errBox.innerText = "FEHLER: " + data.error;
                errBox.classList.remove('hidden');
                btn.disabled = false;
                btn.innerText = "Kanal hinzufügen";
            }
        }
    </script>
</body>
</html>
