<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Formatter — Markdown + LaTeX</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .tg-bubble {
            background: white;
            padding: 16px;
            border-radius: 12px;
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            word-wrap: break-word;
            white-space: pre-wrap;
        }
    </style>
</head>
<body class="bg-slate-50 font-sans min-h-screen">

<header class="bg-white border-b border-slate-200">
    <div class="max-w-6xl mx-auto px-6 py-4 flex items-center gap-2">
        <i class="fa-solid fa-paper-plane text-sky-600"></i>
        <h1 class="text-xl font-black text-slate-800">Telegram Formatter</h1>
        <span class="text-xs text-slate-400 uppercase font-bold tracking-wider">Markdown + LaTeX → Telegram</span>
        <span id="status" class="ml-auto text-xs font-bold"></span>
    </div>
</header>

<main class="max-w-6xl mx-auto px-6 py-8 grid grid-cols-1 lg:grid-cols-2 gap-8">

    <!-- Eingabe -->
    <section class="space-y-4">
        <label class="block text-sm font-bold text-slate-700">Markdown + LaTeX Eingabe</label>
        <textarea id="input" rows="18"
                  class="w-full p-4 border border-slate-300 rounded-xl font-mono text-sm outline-none focus:border-sky-500 resize-y"
                  placeholder="**Fett**, *kursiv*, __unterstrichen__, `code` und $x^2 + y^2$ ..."></textarea>
        <button id="sendBtn"
                class="w-full bg-sky-600 hover:bg-sky-700 text-white font-bold py-3 rounded-xl shadow-md transition-colors">
            An Telegram senden
        </button>
        <p id="sendStatus" class="text-sm text-slate-500"></p>
    </section>

    <!-- Vorschau / Ausgabe -->
    <section class="space-y-4">
        <label class="block text-sm font-bold text-slate-700">Vorschau (Live)</label>
        <div class="tg-bubble text-sm" id="preview">Vorschau erscheint hier…</div>

        <label class="block text-sm font-bold text-slate-700 pt-2">Gebaute Telegram-Payloads</label>
        <pre id="payloads" class="bg-slate-900 text-slate-100 text-xs p-4 rounded-xl overflow-auto max-h-96">—</pre>
    </section>

</main>

<script>
    const input = document.getElementById('input');
    const preview = document.getElementById('preview');
    const payloads = document.getElementById('payloads');
    const sendBtn = document.getElementById('sendBtn');
    const sendStatus = document.getElementById('sendStatus');

    // Einfache Markdown-Vorschau (nur zur Orientierung im Editor).
    function renderPreview() {
        let t = (input.value || '');
        t = t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        t = t.replace(/^#+\s+(.*)$/gm, '<b>$1</b>');
        t = t.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
        t = t.replace(/\*(.+?)\*/g, '<i>$1</i>');
        t = t.replace(/__(.+?)__/g, '<u>$1</u>');
        t = t.replace(/\n/g, '<br>');
        preview.innerHTML = t || 'Vorschau erscheint hier…';
    }

    async function refreshPayloads() {
        const res = await fetch('/api/convert', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({text: input.value})
        });
        const data = await res.json();
        payloads.textContent = JSON.stringify(data, null, 2);
        if (data.count > 1) {
            sendStatus.textContent = `Hinweis: ${data.count} Nachrichten (automatisch aufgeteilt).`;
        } else {
            sendStatus.textContent = '';
        }
    }

    async function send() {
        sendBtn.disabled = true;
        sendBtn.textContent = 'Sende…';
        try {
            const res = await fetch('/api/send', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({text: input.value})
            });
            const data = await res.json();
            sendStatus.textContent = data.error ? ('Fehler: ' + data.error) : `✅ ${data.sent} Nachricht(en) gesendet.`;
        } catch (e) {
            sendStatus.textContent = 'Netzwerkfehler.';
        } finally {
            sendBtn.disabled = false;
            sendBtn.textContent = 'An Telegram senden';
        }
    }

    input.addEventListener('input', () => { renderPreview(); refreshPayloads(); });
    sendBtn.addEventListener('click', send);

    renderPreview();
    refreshPayloads();
</script>
</body>
</html>
