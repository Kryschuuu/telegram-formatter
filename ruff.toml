# Ruff-Konfiguration — bewusst explizit, damit CI-Ergebnisse reproduzierbar
# sind (unabhängig von der Ruff-Version und ihren Standardregeln).
#
# Regelsatz:
#   E4/E7/E9  Fehler und offensichtliche Stilprobleme
#   F         Pyflakes (unbenutzte Importe/Variablen, ...)
#   I         Import-Sortierung
#   UP        Modernisierung (pyupgrade)
#   B         flake8-bugbear (typische Fehlerfallen)
#
# Ausgenommen: tests/fixtures — dort liegt das absichtlich unsichere
# Negativbeispiel für das Regelwerk von botkit.review.

line-length = 100
target-version = "py311"
exclude = ["tests/fixtures", ".venv", "venv", "build", "dist"]

[lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
# UP042 (StrEnum) bleibt ignoriert: das Projekt unterstützt Python 3.10+.
ignore = ["UP042"]
